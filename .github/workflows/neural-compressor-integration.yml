name: neural-compressor-integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "integration/**"]

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile modules
        run: |
          python -m py_compile model/blocks.py model/losses.py training/dataset.py training/train.py
      - name: Run integration tests
        run: python -m pytest -q tests/test_recovered_integration.py
      - name: Run one-epoch CPU smoke
        run: |
          python -m training.train \
            --epochs 1 --n-samples 8 --n-val 4 --n-test 4 \
            --batch-size 2 --duration 0.25 --no-amp --device cpu \
            --deterministic --out-dir "${{ runner.temp }}/nc-smoke"
